<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
</head>
<body>
      
  <h2>
    Rock Paper Scissors
  </h2>

  <button onclick="

    playGame('rock');

  ">Rock</button>

  <button onclick="

    playGame('paper');
  
  ">Paper</button>

  <button onclick="

    playGame('scissors');
  
  ">Scissors</button>

  <button onclick ="

    resetScore(); 
    
  ">Reset Score</button>


  <script>

       const score = {
        wins : 0,
        losses : 0,
        ties : 0
       }

       function pickComputerMove() {

       let computerMove = '';

       const randomNumber = Math.random();

       if(randomNumber >= 0 && randomNumber < 1/3) {
        computerMove = 'rock';
       }

       else if(randomNumber >= 1/3 && randomNumber < 2/3) {
        computerMove = 'paper';
       }
       
       else {
        computerMove = 'scissors';
       }

       return computerMove;

      }

      function playGame(userMove) {

         let computerMove = pickComputerMove();
         
         let result = '';

         if (userMove === computerMove) {
            result = 'Tie.';
            score.ties += 1;
         } 

         else if (
         (userMove === 'rock' && computerMove === 'scissors') ||
         (userMove === 'paper' && computerMove === 'rock') ||
         (userMove === 'scissors' && computerMove === 'paper')
         ) {
           result = 'You win.';
           score.wins += 1;
         } 

         else {
          result = 'You lose.';
          score.losses += 1;
         }

         console.log(localStorage.setItem('score' , JSON.stringify));
          
         alert(`Computer chose ${computerMove}. You chose ${userMove}. ${result}
Wins : ${score.wins}, Losses : ${score.losses}, Ties : ${score.ties}`);

        }

        function resetScore()  {
          score.wins = 0;
          score.losses = 0;
          score.ties = 0;

          alert(`Wins : ${score.wins}, Losses : ${score.losses}, Ties : ${score.ties}
Let's start again!`);
        }


  </script>
</body>
</html>
