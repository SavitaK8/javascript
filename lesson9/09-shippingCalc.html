<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Projects</title>
</head>
<body>

  <h4>Amazon Shipping Calculator</h4>

  <p>Orders under $40 = +$10 shipping</p>
  <p>Orders over $40 = FREE shipping</p>

  <input placeholder="Cost of order" class="js-cost-input" onkeydown="handleCostKeydown(event)">

  <button onclick="
    calculateTotal();
  ">Calculate</button>

  <p class = "js-total-cost"></p>
  
<script>

   function handleCostKeydown(event) {
    if(event.key === 'Enter') {
      calculateTotal();
    }
   }
   
   function calculateTotal() {
    
    const inputElement = document.querySelector('.js-cost-input');

    let cost = Number(inputElement.value);

    if(cost <= 40) cost += 10;

    document.querySelector('.js-total-cost').textContent = `Total Cost : $${cost}`;

   }
  
  
</script>

</body>
</html>
