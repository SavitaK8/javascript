<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Projects</title>
  <style>

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .subscribe-button {
      border: none;
      background-color: black;
      color: white;
      padding: 10px 15px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      margin-bottom: 30px;
    }

    .is-subscribed {
      background-color: red;
    }

    .cost-input {
      font-size : 15px;
      padding: 10px;
    }

    .calculate-button {
      background-color: green;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 15px;
      padding: 12px 15px;
      cursor: pointer;
    }

    

  </style>
</head>
<body>

  <h3>Youtube Subscribe Button</h3>

  <button onclick = "clickSubscribe();" class="js-subscribe-button subscribe-button">Subscribe</button>


  <h3>Amazon Shipping Calculator</h3>

  <p>Orders under $40 = +$10 shipping</p>
  <p>Orders over $40 = FREE shipping</p>

  <input placeholder="Cost of order" class="js-cost-input cost-input" onkeydown="handleCostKeydown(event)">

  <button onclick="
    calculateTotal();
  " class="calculate-button">Calculate</button>

  <p class = "js-total-cost"></p>
  
<script>

  function clickSubscribe() {

    const buttonElement = document.querySelector('.js-subscribe-button');

    if(buttonElement.innerText === 'Subscribe') {
      buttonElement.innerHTML = 'Subscribed';
      buttonElement.classList.add('is-subscribed');
    } else {
      buttonElement.innerHTML = 'Subscribe';
      buttonElement.classList.remove('is-subscribed');
    }

  }

  function handleCostKeydown(event) {
    if(event.key === 'Enter') {
      calculateTotal();
    }
  }
   
  function calculateTotal() {
    
    const inputElement = document.querySelector('.js-cost-input');

    let cost = Number(inputElement.value);

    if(cost <= 40) cost += 10;

    document.querySelector('.js-total-cost').textContent = `Total Cost : $${cost}`;

  }
  
</script>

</body>
</html>
