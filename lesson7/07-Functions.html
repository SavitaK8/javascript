<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Functions</title>
</head>
<body>

  <script>

    function calculateTax(cost) {
        console.log(`Taxes : $${cost * 0.1}`);
    }

    let cost = 10;
    console.log(`Total cost : $${cost}`);

    calculateTax(cost);

  </script>
</body>
</html>
